<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees</title>

    <link rel="stylesheet" href="../fall-26-27_Coaching_Center_Management_System/css/style4_accountant.css">
</head>

<body>

    <h1>🎓 CoachEase</h1>
    <h3>Accountant Dashboard</h3>

    <nav>
        <a href="dashboard_accountant.html">Dashboard</a>
        <a href="fees_accountant.html">Student Fee Collection</a>
        <a href="expense_accountant.html">Expense Tracking</a>
        <a href="salary_accountant.html">Salary Management</a>
    </nav>

    <fieldset>

        <h2>Student Fee Collection</h2>

        <form id="feeForm">

            <table>

                <tr>
                    <td>
                        <label for="student_id">Student ID:</label>
                    </td>

                    <td>
                        <input type="text" id="student_id" name="student_id" placeholder="Enter student ID" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="student_name">Student Name:</label>
                    </td>

                    <td>
                        <input type="text" id="student_name" name="student_name" placeholder="Enter student name"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="fee_class">Class:</label>
                    </td>

                    <td>
                        <select id="fee_class" name="fee_class" required>
                            <option value="" selected disabled>Select Class</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10">Class 10</option>
                            <option value="Class 11">Class 11</option>
                            <option value="Class 12">Class 12</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="fee_month">Fee Month:</label>
                    </td>

                    <td>
                        <select id="fee_month" name="fee_month" required>
                            <option value="" selected disabled>Select Month</option>
                            <option>January</option>
                            <option>February</option>
                            <option>March</option>
                            <option>April</option>
                            <option>May</option>
                            <option>June</option>
                            <option>July</option>
                            <option>August</option>
                            <option>September</option>
                            <option>October</option>
                            <option>November</option>
                            <option>December</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="fee_amount">Fee Amount:</label>
                    </td>

                    <td>
                        <input type="number" id="fee_amount" name="fee_amount" min="0.01" step="0.01"
                            placeholder="Enter amount" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="payment_date">Payment Date:</label>
                    </td>

                    <td>
                        <input type="date" id="payment_date" name="payment_date" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="payment_method">Payment Method:</label>
                    </td>

                    <td>
                        <select id="payment_method" name="payment_method" required>
                            <option value="" selected disabled>Select Method</option>
                            <option value="Cash">Cash</option>
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td></td>

                    <td>
                        <input type="submit" id="feeSubmit" value="Collect Fee">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

        <h3>Fee Collection List</h3>

        <table border="1">

            <thead>
                <tr>
                    <th>Receipt ID</th>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Class</th>
                    <th>Month</th>
                    <th>Amount</th>
                    <th>Payment Method</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="feeList">
            </tbody>

        </table>

    </fieldset>

    <script src="../fall-26-27_Coaching_Center_Management_System/js/accountant.js" defer></script>

</body>

</html>
