<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachEase - Add New Teacher</title>
    <link rel="stylesheet" type="text/css" href="../fall-26-27_Coaching_Center_Management_System/css/add_admin.css">
</head>

<body>

    <h1>🎓 CoachEase</h1>

    <nav>
        <a href="Dashboard_admin.html">Dashboard</a> |
        <a href="student_admission_admin.html">Student Admission</a> |
        <a href="teacher_management_admin.html">Teacher Management</a> |
        <a href="batch_management_admin.html">Batch Management</a> |
        <a href="course_management_admin.html">Course Management</a>
    </nav>

    <fieldset>
        <legend>👨‍🏫 Create Teacher Account</legend>

        <form method="post">

            <table>

                <tr>
                    <td colspan="2">
                        First Name:<br>
                        <input type="text" name="first_name" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Last Name:<br>
                        <input type="text" name="last_name" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Email Address:<br>
                        <input type="email" name="email" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Phone Number:<br>
                        <input type="tel" name="phone" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Qualification:<br>
                        <input type="text" name="qualification" required>
                    </td>
                </tr>

                <!-- Select Course -->
                <tr>
                    <td colspan="2">
                        Select Course:<br>
                        <select name="course_id" required>
                            <option value="" selected disabled>Select Course</option>
                            <option value="CRS-101">Web Development</option>
                            <option value="CRS-102">Graphic Design</option>
                            <option value="CRS-103">Digital Marketing</option>
                            <option value="CRS-104">Programming Fundamentals</option>
                            <option value="CRS-105">UI/UX Design</option>
                            <option value="CRS-106">Data Science</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Username:<br>
                        <input type="text" name="username" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Password:<br>
                        <input type="password" name="password" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Add Teacher">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </fieldset>

</body>

</html>
