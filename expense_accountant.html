<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense</title>

    <link rel="stylesheet" href="../fall-26-27_Coaching_Center_Management_System/css/style4_accountant.css">
</head>

<body>

    <h1>🎓 CoachEase</h1>
    <h3>Accountant Dashboard</h3>

    <nav>
        <a href="dashboard_accountant.html">Dashboard</a>
        <a href="fees_accountant.html">Student Fee Collection</a>
        <a href="expense_accountant.html">Expense Tracking</a>
        <a href="salary_accountant.html">Salary Management</a>
    </nav>

    <fieldset>

        <h2>Expense Tracking</h2>

        <form id="expenseForm">

            <table>

                <tr>
                    <td>
                        <label for="expense_name">Expense Name:</label>
                    </td>

                    <td>
                        <input type="text" id="expense_name" name="expense_name" placeholder="Enter expense name"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="expense_category">Category:</label>
                    </td>

                    <td>
                        <select id="expense_category" name="expense_category" required>
                            <option value="" selected disabled>Select Category</option>
                            <option>Utilities</option>
                            <option>Rent</option>
                            <option>Stationery</option>
                            <option>Maintenance</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="expense_amount">Amount:</label>
                    </td>

                    <td>
                        <input type="number" id="expense_amount" name="expense_amount" min="0.01" step="0.01"
                            placeholder="Enter amount" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="expense_date">Expense Date:</label>
                    </td>

                    <td>
                        <input type="date" id="expense_date" name="expense_date" required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="expense_note">Description:</label>
                    </td>

                    <td>
                        <textarea id="expense_note" name="expense_note" rows="3" cols="25"
                            placeholder="Enter details"></textarea>
                    </td>
                </tr>

                <tr>
                    <td></td>

                    <td>
                        <input type="submit" id="expenseSubmit" value="Add Expense">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

        <h3>Expense List</h3>

        <table border="1">

            <thead>
                <tr>
                    <th>Expense ID</th>
                    <th>Expense Name</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseList">
            </tbody>

        </table>

    </fieldset>

    <script src="../fall-26-27_Coaching_Center_Management_System/js/accountant.js" defer></script>

</body>

</html>
