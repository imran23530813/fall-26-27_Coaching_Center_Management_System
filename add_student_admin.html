<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachEase - Student Admission Form</title>
    <link rel="stylesheet" type="text/css" href="../fall-26-27_Coaching_Center_Management_System/css/add_admin.css">
</head>

<body>

    <h1>🎓 CoachEase</h1>

    <nav>
        <a href="Dashboard_admin.html">Dashboard</a> |
        <a href="student_admission_admin.html">Student Admission</a> |
        <a href="teacher_management_admin.html">Teacher Management</a> |
        <a href="batch_management_admin.html">Batch Management</a> |
        <a href="course_management_admin.html">Course Management</a>
    </nav>

    <fieldset>
        <legend>➕ Add New Student</legend>

        <form method="post">

            <table>

                <tr>
                    <td colspan="2">
                        First Name:<br>
                        <input type="text" name="first_name" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Last Name:<br>
                        <input type="text" name="last_name" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Email Address:<br>
                        <input type="email" name="email" required>
                    </td>
                </tr>

                <!-- Select Batch -->
                <tr>
                    <td colspan="2">
                        Select Batch:<br>
                        <select name="batch_id" required>
                            <option value="" selected disabled>Select Batch</option>

                            <option value="BAT-101">
                                BAT-101 - Web Development (L-3, Fall)
                            </option>

                            <option value="BAT-102">
                                BAT-102 - Graphic Design (L-3, Spring)
                            </option>

                            <option value="BAT-103">
                                BAT-103 - Digital Marketing (L-3, Summer)
                            </option>

                            <option value="BAT-104">
                                BAT-104 - Programming Fundamentals (L-2, Fall)
                            </option>

                            <option value="BAT-105">
                                BAT-105 - UI/UX Design (L-2, Spring)
                            </option>

                            <option value="BAT-106">
                                BAT-106 - Data Science (L-1, Summer)
                            </option>

                        </select>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Admission Date:<br>
                        <input type="date" name="admission_date" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Contact Number:<br>
                        <input type="tel" name="contact" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Home Address:<br>
                        <input type="text" name="address" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Add Student">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </fieldset>

</body>

</html>
