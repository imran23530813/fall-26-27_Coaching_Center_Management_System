<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachEase - Add New Teacher</title>
</head>

<body>

    <h1>🎓 CoachEase</h1>
    <h2>👨‍🏫 Add New Teacher</h2>

    <a href="Dashboard.html">Dashboard</a>
    <a href="student_admission.html">Student Admission</a> |
    <a href="teacher_management.html">Teacher Management</a> |
    <a href="batch_management.html">Batch Management</a> |
    <a href="course_management.html">Course Management</a>
    </nav>

    <fieldset>
        <legend>Create Teacher Account</legend>

        <form method="post">

            <table>

                <tr>
                    <td>First Name:</td>
                    <td><input type="text" name="first_name" required></td>
                </tr>

                <tr>
                    <td>Last Name:</td>
                    <td><input type="text" name="last_name" required></td>
                </tr>

                <tr>
                    <td>Email Address:</td>
                    <td><input type="email" name="email" required></td>
                </tr>

                <tr>
                    <td>Phone Number:</td>
                    <td><input type="tel" name="phone" required></td>
                </tr>

                <tr>
                    <td>Qualification:</td>
                    <td><input type="text" name="qualification" required></td>
                </tr>

                <tr>
                    <td>Select Class:</td>
                    <td>
                        <select name="class" required>
                            <option value="">Select Class</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10">Class 10</option>
                            <option value="Class 11">Class 11</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Username:</td>
                    <td><input type="text" name="username" required></td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password" required></td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Add Teacher">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>

        </form>
    </fieldset>

</body>
