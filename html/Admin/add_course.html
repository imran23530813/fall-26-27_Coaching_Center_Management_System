<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachEase - Add Course</title>
    <!-- <link rel="stylesheet" type="text/css" href="../../css/style.css"> -->
</head>

<body>

    <h1>🎓 CoachEase</h1>
    <!-- <h2>➕ Add New Course</h2> -->

    <nav>
        <a href="Dashboard.html">Dashboard</a> |
        <a href="student_admission.html">Student Admission</a> |
        <a href="teacher_management.html">Teacher Management</a> |
        <a href="batch_management.html">Batch Management</a> |
        <a href="course_management.html">Course Management</a>
    </nav>

    <br><br>

    <fieldset>
        <legend>➕Add Course Information</legend>


        <form method="post">

            <table>

                <tr>
                    <td colspan="2">
                        <label for="class">Select Class:</label><br>
                        <select id="class" name="class" required>
                            <option value="">-- Select Class --</option>
                            <option value="6">Class 6</option>
                            <option value="7">Class 7</option>
                            <option value="8">Class 8</option>
                            <option value="9">Class 9</option>
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <label for="cname">Course Name:</label><br>
                        <select id="cname" name="cname" required>
                            <option value="">-- Select Course --</option>
                            <option value="Bangla">Bangla</option>
                            <option value="English">English</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Science">Science</option>
                            <option value="Bangladesh and Global Studies">Bangladesh and Global Studies</option>
                            <option value="ICT">Information and Communication Technology (ICT)</option>
                            <option value="Religious Education">Religious and Moral Education</option>
                            <option value="Physical Education">Physical Education and Health</option>
                            <option value="Work and Life Education">Work and Life Oriented Education</option>
                            <option value="Agriculture Studies">Agriculture Studies</option>
                            <option value="Home Science">Home Science</option>
                            <option value="Arts and Crafts">Arts and Crafts</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Biology">Biology</option>
                            <option value="Higher Mathematics">Higher Mathematics</option>
                            <option value="History">History of Bangladesh and World Civilization</option>
                            <option value="Geography">Geography and Environment</option>
                            <option value="Civics">Civics and Citizenship</option>
                            <option value="Accounting">Accounting</option>
                            <option value="Finance and Banking">Finance and Banking</option>
                            <option value="Business Entrepreneurship">Business Entrepreneurship</option>
                            <option value="Business Organization and Management">Business Organization and Management
                            </option>
                            <option value="Banking and Insurance">Banking and Insurance</option>
                            <option value="Economics">Economics</option>
                            <option value="Logic">Logic</option>
                            <option value="Sociology">Sociology</option>
                            <option value="Social Work">Social Work</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <label for="cdesc">Description:</label><br>
                        <input type="text" id="cdesc" name="cdesc" placeholder="Describe something">
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <label for="cfee">Course Fee:</label><br>
                        <input type="number" id="cfee" name="cfee" placeholder="Add amount" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Add Course">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </fieldset>

</body>
