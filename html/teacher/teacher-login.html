<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - IIST LMP</title>
   <link rel="stylesheet" href="../../Style5.css">

<body>
    <!-- ===== CLASS-13: HEADER START ===== -->
    <header>
        <h1>Coaching Management System</h1>
        <p>Learn Skills for a Better Future</p>
    </header>
    <!-- ===== CLASS-13: HEADER END ===== -->

    <!-- ===== CLASS-13: NAVIGATION START ===== -->
    <nav>
        <a href="index.html">Home</a> |
        <a href="teacher-dashboard.html">Teacher Dashboard</a> |

        <a href="teacher-login.html">Teacher Login</a>
    </nav>
    <!-- ===== CLASS-13: NAVIGATION END ===== -->

    <!-- ===== CLASS-13: TEACHER LOGIN START ===== -->
    <main>
        <marquee behavior="" direction="">
            <h4>🎓 Welcome to the Teacher Portal, track your students’ progress here</h4>
        </marquee>
        <section class="teacher-login-section">
            <h2>Teacher Login</h2>
            <p>Enter your teacher account details.</p>
            <!-- ===== CLASS-JS-22: TEACHER LOGIN FORM START (REPLACE) ===== -->
            <form id="teacherLoginForm">
                <label for="teacherEmail">Email</label>
                <input type="email" id="teacherEmail" required>

                <label for="teacherPassword">Password</label>
                <input type="password" id="teacherPassword" minlength="6" required>

                <button type="submit">Login</button>
                <p id="teacherLoginMessage" aria-live="polite"></p>
            </form>
            <!-- ===== CLASS-JS-22: TEACHER LOGIN FORM END ===== -->

        </section>
    </main>
    <!-- ===== CLASS-13: TEACHER LOGIN END ===== -->

    <!-- ===== CLASS-13: FOOTER START ===== -->
    <footer>
        <p>&copy; 2026 IIST Polytechnic Institute.
            All Rights Reserved.</p>
    </footer>
    <!-- ===== CLASS-13: FOOTER END ===== -->
    <script src="js/app.js"></script>
</body>

</html>
