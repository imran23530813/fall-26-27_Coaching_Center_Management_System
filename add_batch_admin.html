<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CoachEase - Add New Batch</title>
    <link rel="stylesheet" type="text/css" href="../fall-26-27_Coaching_Center_Management_System/css/add_admin.css">
</head>

<body>

    <h1>🎓 CoachEase</h1>

    <nav>
        <a href="Dashboard_admin.html">Dashboard</a> |
        <a href="student_admission_admin.html">Student Admission</a> |
        <a href="teacher_management_admin.html">Teacher Management</a> |
        <a href="batch_management_admin.html">Batch Management</a> |
        <a href="course_management_admin.html">Course Management</a>
    </nav>

    <br><br>

    <fieldset>
        <legend>➕ Create Batch</legend>

        <form method="post">

            <table>

                <!-- Select Batch Type -->
                <tr>
                    <td colspan="2">
                        Select Batch Type:<br>
                        <select name="batch_type" required>
                            <option value="" selected disabled>Select Batch Type</option>
                            <option value="Fall">Fall</option>
                            <option value="Spring">Spring</option>
                            <option value="Summer">Summer</option>
                        </select>
                    </td>
                </tr>

                <!-- Select Batch Name -->
                <tr>
                    <td colspan="2">
                        Select Batch Name:<br>
                        <select name="course_id" required>
                            <option value="" selected disabled>Select Batch Name</option>
                            <option value="CRS-101">Web Development Batch</option>
                            <option value="CRS-102">Graphic Design Batch</option>
                            <option value="CRS-103">Digital Marketing Batch</option>
                            <option value="CRS-104">Programming Fundamentals Batch</option>
                            <option value="CRS-105">UI/UX Design Batch</option>
                            <option value="CRS-106">Data Science Batch</option>
                        </select>
                    </td>
                </tr>

                <!-- Select Level -->
                <tr>
                    <td colspan="2">
                        Select Level:<br>
                        <select name="level" required>
                            <option value="" selected disabled>Select Level</option>
                            <option value="L-1">L-1</option>
                            <option value="L-2">L-2</option>
                            <option value="L-3">L-3</option>
                        </select>
                    </td>
                </tr>

                <!-- Select Day -->
                <tr>
                    <td colspan="2">
                        Select Day:<br>
                        <select name="batch_day" required>
                            <option value="" selected disabled>Select Day</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                        </select>
                    </td>
                </tr>

                <!-- Start Time -->
                <tr>
                    <td colspan="2">
                        Start Time:<br>
                        <select name="start_time" required>
                            <option value="" selected disabled>Select Start Time</option>
                            <option value="08:00 AM">08:00 AM</option>
                            <option value="08:30 AM">08:30 AM</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="09:30 AM">09:30 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="10:30 AM">10:30 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="11:30 AM">11:30 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="12:30 PM">12:30 PM</option>
                            <option value="01:00 PM">01:00 PM</option>
                            <option value="01:30 PM">01:30 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="02:30 PM">02:30 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="03:30 PM">03:30 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="04:30 PM">04:30 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                        </select>
                    </td>
                </tr>

                <!-- End Time -->
                <tr>
                    <td colspan="2">
                        End Time:<br>
                        <select name="end_time" required>
                            <option value="" selected disabled>Select End Time</option>
                            <option value="09:30 AM">09:30 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="10:30 AM">10:30 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="11:30 AM">11:30 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="12:30 PM">12:30 PM</option>
                            <option value="01:00 PM">01:00 PM</option>
                            <option value="01:30 PM">01:30 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="02:30 PM">02:30 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="03:30 PM">03:30 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="04:30 PM">04:30 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                        </select>
                    </td>
                </tr>

                <!-- Assigned Teacher -->
                <tr>
                    <td colspan="2">
                        Assigned Teacher:<br>
                        <select name="teacher" required>
                            <option value="" selected disabled>Select Teacher</option>
                            <option value="Mr. Rahman">Mr. Rahman</option>
                            <option value="Ms. Sultana">Ms. Sultana</option>
                            <option value="Dr. Ahmed">Dr. Ahmed</option>
                            <option value="Mr. Karim">Mr. Karim</option>
                            <option value="Ms. Nabila">Ms. Nabila</option>
                            <option value="Mr. Hasan">Mr. Hasan</option>
                        </select>
                    </td>
                </tr>

                <!-- Buttons -->
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Create Batch">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>
    </fieldset>

</body>

</html>
